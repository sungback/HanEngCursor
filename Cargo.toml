[package]
name = "hanengcursor"
version = "0.2.0"
edition = "2021"
description = "Windows 10/11 Korean/English IME input indicator next to mouse cursor"

[[bin]]
name = "HanEngCursor"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
]

[profile.release]
opt-level = "s"
lto = true
strip = true

[build-dependencies]
embed-resource = "3.0.6"

